spring:
  application:
    name: dgac-ms-drones
    
  datasource:
    url: ${DB_URL:jdbc:postgresql://ep-orange-meadow-apb2mull-pooler.c-7.us-east-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require}
    username: ${DB_USERNAME:neondb_owner}
